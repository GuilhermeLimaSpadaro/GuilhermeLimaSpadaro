<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfdbfe" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect width="900" height="160" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#c)">
    <rect width="900" height="160" fill="#f8fafc"/>

    <ellipse cx="120" cy="80" rx="260" ry="180" fill="url(#g1)">
      <animate attributeName="cx" values="120;160;120" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </ellipse>

    <ellipse cx="800" cy="90" rx="240" ry="160" fill="url(#g2)">
      <animate attributeName="cx" values="800;760;800" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </ellipse>

    <ellipse cx="450" cy="160" rx="320" ry="120" fill="url(#g3)">
      <animate attributeName="cy" values="160;140;160" dur="14s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </ellipse>

    <text x="450" y="82" font-family="'Segoe UI',Arial,sans-serif" font-size="46" font-weight="700" fill="#0f172a" letter-spacing="-2" text-anchor="middle" opacity="0">
      Guilherme Spadaro
      <animate attributeName="opacity" values="0;1" dur="1s" begin="0.1s" fill="freeze"/>
    </text>

    <text x="450" y="118" font-family="monospace" font-size="13" fill="#64748b" letter-spacing="2.5" text-anchor="middle" opacity="0">
      Backend Developer · São Paulo
      <animate attributeName="opacity" values="0;1" dur="1s" begin="0.5s" fill="freeze"/>
    </text>
  </g>
</svg>
