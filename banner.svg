<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#0b1b3a"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flowGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="flowBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#38bdf8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- terminal window -->
    <g id="term">
      <rect width="100" height="60" rx="7" fill="#0a1226" stroke="#1e4976" stroke-width="1.2"/>
      <path d="M0 14H100V7a7 7 0 0 0-7-7H7a7 7 0 0 0-7 7Z" fill="#12213f"/>
      <circle cx="9" cy="7" r="2.2" fill="#f87171" fill-opacity="0.7"/>
      <circle cx="17" cy="7" r="2.2" fill="#fbbf24" fill-opacity="0.7"/>
      <circle cx="25" cy="7" r="2.2" fill="#34d399" fill-opacity="0.8"/>
    </g>

    <!-- database -->
    <g id="db">
      <path d="M0 8V40C0 46 9 49 20 49S40 46 40 40V8" fill="#0a1226" stroke="#38bdf8" stroke-width="1.5"/>
      <ellipse cx="20" cy="8" rx="20" ry="7" fill="#12213f" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M0 20C0 26 9 29 20 29S40 26 40 20" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
      <path d="M0 32C0 38 9 41 20 41S40 38 40 32" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.45"/>
    </g>

    <!-- service box -->
    <g id="svc">
      <rect width="50" height="34" rx="6" fill="#0a1226" stroke="#34d399" stroke-width="1.4"/>
      <rect x="8" y="8" width="26" height="4" rx="2" fill="#34d399" fill-opacity="0.7"/>
      <rect x="8" y="16" width="18" height="4" rx="2" fill="#38bdf8" fill-opacity="0.6"/>
      <circle cx="41" cy="10" r="2.5" fill="#34d399"/>
      <rect x="8" y="24" width="30" height="3" rx="1.5" fill="#94a3b8" fill-opacity="0.35"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>
  <ellipse cx="1090" cy="120" rx="330" ry="190" fill="url(#glowBlue)"/>
  <ellipse cx="1220" cy="300" rx="260" ry="120" fill="url(#glowGreen)"/>
  <ellipse cx="90" cy="40" rx="200" ry="110" fill="url(#glowBlue)" fill-opacity="0.6"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="15.5" fill="none" stroke="#38bdf8" stroke-opacity="0.2"/>

  <!-- flowing data lines along the edges -->
  <path d="M230 300C420 262 560 316 760 288S1080 262 1280 296" fill="none" stroke="url(#flowGreen)" stroke-width="2" stroke-dasharray="7 11" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-180" dur="7s" repeatCount="indefinite"/>
  </path>
  <path d="M0 292C60 280 130 300 210 286" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 9">
    <animate attributeName="stroke-dashoffset" values="0;-130" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M420 18C560 34 700 4 840 22S1000 30 1060 14" fill="none" stroke="url(#flowBlue)" stroke-width="1.6" stroke-dasharray="3 9">
    <animate attributeName="stroke-dashoffset" values="0;-120" dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- top-left: terminal -->
  <g transform="translate(28 26) scale(1.7 1.45)" opacity="0.9">
    <use href="#term"/>
    <rect x="9" y="22" width="34" height="3.5" rx="1.7" fill="#34d399" fill-opacity="0.8"/>
    <rect x="15" y="30" width="48" height="3.5" rx="1.7" fill="#38bdf8" fill-opacity="0.7"/>
    <rect x="15" y="38" width="30" height="3.5" rx="1.7" fill="#94a3b8" fill-opacity="0.4"/>
    <rect x="9" y="46" width="22" height="3.5" rx="1.7" fill="#34d399" fill-opacity="0.55"/>
  </g>

  <!-- bottom-left: mini architecture -->
  <g opacity="0.9">
    <path d="M50 246L100 268L152 244" fill="none" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.4"/>
    <circle cx="50" cy="246" r="6" fill="#0a1226" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="100" cy="268" r="6" fill="#0a1226" stroke="#34d399" stroke-width="1.5" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="152" cy="244" r="6" fill="#0a1226" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- abstract steam/cup (Java) -->
    <g transform="translate(184 238)" fill="none" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round">
      <path d="M2 14C-1 9 6 6 3 0"/>
      <path d="M10 14C7 9 14 6 11 0"/>
      <path d="M18 14C15 9 22 6 19 0"/>
      <path d="M-2 20H24V28C24 33 19 36 11 36S-2 33 -2 28Z"/>
    </g>
  </g>

  <!-- right cluster: terminal -->
  <g transform="translate(900 30) scale(2.7 2.1)">
    <use href="#term"/>
    <rect x="9" y="21" width="30" height="3" rx="1.5" fill="#34d399" fill-opacity="0.85"/>
    <rect x="15" y="27" width="46" height="3" rx="1.5" fill="#38bdf8" fill-opacity="0.75"/>
    <rect x="15" y="33" width="34" height="3" rx="1.5" fill="#94a3b8" fill-opacity="0.4"/>
    <rect x="15" y="39" width="54" height="3" rx="1.5" fill="#38bdf8" fill-opacity="0.5"/>
    <rect x="9" y="45" width="18" height="3" rx="1.5" fill="#34d399" fill-opacity="0.6"/>
    <rect x="30" y="45" width="6" height="3" rx="1" fill="#34d399">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- right cluster: architecture diagram -->
  <g>
    <path d="M974 156V196" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.4"/>
    <path d="M1100 156V176H1065V196" fill="none" stroke="#34d399" stroke-opacity="0.45" stroke-width="1.4"/>
    <path d="M890 214H940M1008 214H1040M1090 214H1172" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.4" stroke-dasharray="4 5">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="3s" repeatCount="indefinite"/>
    </path>
    <use href="#svc" x="840" y="197"/>
    <rect x="940" y="196" width="68" height="36" rx="6" fill="#0a1226" stroke="#38bdf8" stroke-width="1.4"/>
    <path d="M954 208h22M954 216h36M954 224h16" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="2.4" stroke-linecap="round"/>
    <use href="#svc" x="1040" y="197"/>
    <use href="#db" x="1172" y="190"/>
    <use href="#db" x="1222" y="214" opacity="0.7"/>
  </g>

  <!-- code glyphs -->
  <text x="1196" y="92" font-family="Consolas, 'Courier New', monospace" font-size="42" font-weight="700" fill="#38bdf8" fill-opacity="0.35" text-anchor="middle">&lt;/&gt;</text>
  <text x="820" y="96" font-family="Consolas, 'Courier New', monospace" font-size="64" font-weight="700" fill="#34d399" fill-opacity="0.22" text-anchor="middle">{ }</text>

  <!-- abstract leaf (Spring) -->
  <g transform="translate(1236 24)" opacity="0.85">
    <path d="M0 40C0 14 18 0 36 0C36 22 24 42 0 40Z" fill="#34d399" fill-opacity="0.25" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/>
    <path d="M2 38C12 26 22 14 34 4" fill="none" stroke="#34d399" stroke-opacity="0.8" stroke-width="1.2"/>
  </g>
</svg>
